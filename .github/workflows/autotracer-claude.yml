# AutoTracer Claude Workflow - Interactive Mode
name: AutoTracer Claude Analysis

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  autotracer-analysis:
    if: github.event.issue_comment.body == '/autotracer' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run AutoTracer Analysis
        uses: anthropics/claude-code-action@beta
        with:
          claude-project: ${{ secrets.CLAUDE_PROJECT_ID }}
          prompt-file: .github/prompts/autotracer_prompt.md
          files: |
            **/*.go
            **/*.py
            **/*.js
            **/*.ts
            **/*.java
            **/*.c
            **/*.cpp
            **/*.cs
            **/*.rb
            **/*.php