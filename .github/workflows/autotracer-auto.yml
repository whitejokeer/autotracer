# AutoTracer Automatic Workflow (Optional)
name: AutoTracer Automatic Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  autotracer-analysis:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/autotracer')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
        
      - name: Run AutoTracer Analysis
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/prompts/autotracer_prompt.md
          allowed_tools: "View,GrepTool,BatchTool,EditTool,CreateFile"
          max_turns: "20"