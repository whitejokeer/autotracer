# AutoTracer Automatic Workflow (Optional)
name: AutoTracer Automatic Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  autotracer-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run AutoTracer Analysis
        uses: anthropics/claude-code-action@beta
        with:
          claude-project: ${{ secrets.CLAUDE_PROJECT_ID }}
          prompt-file: .github/prompts/autotracer_prompt.md
          files: |
            **/*.go
            **/*.py
            **/*.js
            **/*.ts
            **/*.java
            **/*.c
            **/*.cpp
            **/*.cs
            **/*.rb
            **/*.php
          auto-comment: true