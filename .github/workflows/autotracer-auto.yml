# .github/workflows/autotracer.yml
name: AutoTracer Automatic Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  issue_comment:
    types: [created]

jobs:
  autotracer-analysis:
    # Ejecuta sólo cuando el evento coincide con las condiciones
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/autotracer'))
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write          # crear commits
      pull-requests: write     # comentar PRs
      id-token: write          # OIDC (opcional para tus pasos)

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      # 2. Ejecutar AutoTracer (Claude Code)
      - name: Run AutoTracer Analysis
        id: autotracer          # ← añadimos un id para usar su salida si lo deseas
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/prompts/autotracer_prompt.md
          allowed_tools: |
            View,Glob,Grep,LS,Read,Edit,MultiEdit,Write,BatchTool
          max_turns: "20"

      # 3. Verificación rápida de compilación Go (opcional pero recomendable)
      - name: Set up Go
        if: always()
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go vet / build
        if: always()
        run: |
          go vet ./...
          # go test ./...

      # 4. Comentar el resultado (se ejecuta siempre, sea éxito o fallo)
      - name: Comment results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { context, github } = require('@actions/github');

            // Construimos un enlace al run actual
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Texto del comentario: ✅ éxito / ❌ fallo
            const conclusion = process.env.GITHUB_JOB_CONCLUSION || '${{ job.status }}';
            const statusEmoji = conclusion === 'success' ? '✅' : (conclusion === 'cancelled' ? '⚠️' : '❌');
            const body = `${statusEmoji} **AutoTracer** ha finalizado con estado **${conclusion}**.\n\n📝 Revisa los detalles aquí: ${runUrl}`;

            if (context.payload.pull_request) {
              // Comentario en el PR
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            } else if (context.eventName === 'push') {
              // Comentario en el commit
              github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body
              });
            } else {
              // Otros eventos (workflow_dispatch, issue_comment):
              // Creamos (o actualizamos) una "check run" para dejar el mensaje visible
              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'AutoTracer results',
                head_sha: context.sha,
                status: 'completed',
                conclusion: conclusion === 'success' ? 'success' : 'failure',
                output: {
                  title: 'AutoTracer finished',
                  summary: body
                }
              });
            }
