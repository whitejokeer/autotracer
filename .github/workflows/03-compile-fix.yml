name: "03 - Compile & Fix"

on:
  workflow_call:
    inputs:
      trigger_ref:
        type: string
        default: ""
    outputs:
      compilation-success:
        value: ${{ jobs.compile-fix.outputs.compilation-success }}
      fixes-applied:
        value: ${{ jobs.compile-fix.outputs.fixes-applied }}
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  compile-fix:
    name: 🔧 Compile & Fix
    runs-on: ubuntu-latest
    outputs:
      compilation-success: ${{ steps.final-check.outputs.success }}
      fixes-applied: ${{ steps.compile-loop.outputs.attempts }}

    steps:
      # ─────────────────────────────────────────
      # 0. Checkout code
      # ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trigger_ref || github.ref }}

      # ─────────────────────────────────────────
      # 1. Locate go.mod (detect module directory)
      # ─────────────────────────────────────────
      - name: Locate go.mod
        id: moddir
        run: |
          set -e
          ROOT=$(pwd)
          MODFILE=$(find "$ROOT" -name go.mod | head -n 1 || true)
          if [ -z "$MODFILE" ]; then
            echo "❌ No go.mod found after instrumentation"
            exit 1
          fi
          MODDIR=$(dirname "$MODFILE")
          echo "Found go.mod in $MODDIR"
          echo "MODDIR=$MODDIR" >> $GITHUB_ENV
          echo "moddir=$MODDIR" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      # 2. Download instrumented artefacts
      # ─────────────────────────────────────────
      - name: Download all instrumented code
        uses: actions/download-artifact@v4
        with:
          pattern: instrumented-*
          merge-multiple: true

      # ─────────────────────────────────────────
      # 3. Setup Go
      # ─────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ─────────────────────────────────────────
      # 4. Ensure deps (go mod tidy) in module dir
      # ─────────────────────────────────────────
      - name: Ensure dependencies (go mod tidy)
        working-directory: ${{ steps.moddir.outputs.moddir }}
        run: |
          echo "## 🔍 go mod tidy in $PWD" >> $GITHUB_STEP_SUMMARY
          go mod tidy

      # ─────────────────────────────────────────
      # 5. Compile loop with self-healing
      # ─────────────────────────────────────────
      - id: compile-loop
        name: Compile and fix loop
        working-directory: ${{ steps.moddir.outputs.moddir }}
        run: |
          ATTEMPT=0
          MAX_ATTEMPTS=5
          SUCCESS=false
          echo "## 🔧 Compilation Process" >> $GITHUB_STEP_SUMMARY
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ((ATTEMPT++))
            echo "### Attempt $ATTEMPT" >> $GITHUB_STEP_SUMMARY
            echo "::group::Compilation attempt $ATTEMPT"
            rm -f compile.log compile_errors.txt
            if go build ./... 2>&1 | tee compile.log; then
              echo "✅ Compilation successful on attempt $ATTEMPT!" >> $GITHUB_STEP_SUMMARY
              SUCCESS=true
              echo "::endgroup::"
              break
            else
              echo "❌ Compilation failed on attempt $ATTEMPT" >> $GITHUB_STEP_SUMMARY
              echo "::endgroup::"
              echo "::group::Compilation errors"
              cat compile.log
              echo "::endgroup::"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                {
                  echo "COMPILATION ERRORS - Attempt $ATTEMPT"
                  echo "====================================="
                  echo ""
                  cat compile.log
                  echo ""
                  echo "Please analyze these compilation errors and fix them systematically."
                  echo "Focus on:"
                  echo "1. Missing imports"
                  echo "2. Function signature mismatches"
                  echo "3. Type errors"
                  echo "4. Unused variables"
                  echo "5. Package-level issues"
                } > compile_errors.txt
              fi
            fi
          done
                          echo "attempts=$ATTEMPT"  >> $GITHUB_OUTPUT
                          echo "success=$SUCCESS"   >> $GITHUB_OUTPUT
                          if [ "$SUCCESS" = "false" ]; then
                            echo "❌ Failed to compile after $MAX_ATTEMPTS attempts" >> $GITHUB_STEP_SUMMARY
                            exit 1
                          fi

      # ─────────────────────────────────────────
      # 6. Ask Claude to fix compilation errors
      # ─────────────────────────────────────────
      - name: Fix compilation errors with Claude
        if: failure()
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/prompts/03-compile-fix.md
          prompt_vars: |
            MODULE_DIR=${{ steps.moddir.outputs.moddir }}
          allowed_tools: |
            View,Glob,Grep,LS,Read,Edit,MultiEdit,Write,BatchTool
          max_turns: "25"

      # ─────────────────────────────────────────
      # 7. Retry compilation after Claude fix
      # ─────────────────────────────────────────
      - id: retry-compile
        name: Retry compilation after fix
        if: failure()
        continue-on-error: true
        working-directory: ${{ steps.moddir.outputs.moddir }}
        run: |
          echo "## 🔄 Retry After Claude Fix" >> $GITHUB_STEP_SUMMARY
          if go build ./... 2>&1 | tee retry_compile.log; then
            echo "✅ Compilation successful after Claude fix!" >> $GITHUB_STEP_SUMMARY
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Compilation still failing after Claude fix" >> $GITHUB_STEP_SUMMARY
            echo "success=false" >> $GITHUB_OUTPUT
            echo "### Remaining Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat retry_compile.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ─────────────────────────────────────────
      # 8. Additional static checks
      # ─────────────────────────────────────────
      - id: additional-checks
        name: Run additional checks
        continue-on-error: true
        working-directory: ${{ steps.moddir.outputs.moddir }}
        run: |
          echo "## 🧪 Additional Checks" >> $GITHUB_STEP_SUMMARY
          echo "### go vet" >> $GITHUB_STEP_SUMMARY
          go vet ./... || true
          echo "### go fmt" >> $GITHUB_STEP_SUMMARY
          gofmt -l . || true

      # ─────────────────────────────────────────
      # 9. Final compilation check
      # ─────────────────────────────────────────
      - id: final-check
        name: Final compilation check
        working-directory: ${{ steps.moddir.outputs.moddir }}
        run: |
          echo "## 🎯 Final Verification" >> $GITHUB_STEP_SUMMARY
          if go build ./... 2>&1 | tee final_compile.log; then
            echo "✅ Final compilation successful!" >> $GITHUB_STEP_SUMMARY
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Final compilation failed" >> $GITHUB_STEP_SUMMARY
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ─────────────────────────────────────────
      # 10. Upload logs & artefacts
      # ─────────────────────────────────────────
      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-logs
          path: |
            *.log
            *.txt
          retention-days: 1

      - name: Upload final compiled code
        if: steps.final-check.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: final-code
          path: |
            ${{ steps.moddir.outputs.moddir }}/**/*.go
            ${{ steps.moddir.outputs.moddir }}/go.mod
            ${{ steps.moddir.outputs.moddir }}/go.sum
          retention-days: 1
