name: AutoTracer Pipeline (Coordinator)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ========================================================================
  # COORDINATOR: Orchestrates the entire pipeline
  # ========================================================================
  
  # Phase 1: Analyze Business Flows
  analyze-flows:
    name: 🔍 Phase 1 - Analyze Flows
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/autotracer'))
      || github.event_name == 'pull_request'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/01-analyze-flows.yml
    with:
      trigger_ref: ${{ github.event.pull_request.head.ref || github.ref }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Phase 2: Instrument Flows in Parallel
  instrument-flows:
    name: 🎯 Phase 2 - Instrument Flows
    needs: analyze-flows
    if: needs.analyze-flows.outputs.has-flows == 'true'
    uses: ./.github/workflows/02-instrument-flows.yml
    with:
      trigger_ref: ${{ github.event.pull_request.head.ref || github.ref }}
      matrix: ${{ needs.analyze-flows.outputs.matrix }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Phase 3: Compile and Fix
  compile-and-fix:
    name: 🔧 Phase 3 - Compile & Fix
    needs: [analyze-flows, instrument-flows]
    if: needs.analyze-flows.outputs.has-flows == 'true'
    uses: ./.github/workflows/03-compile-fix.yml
    with:
      trigger_ref: ${{ github.event.pull_request.head.ref || github.ref }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Phase 4: Finalize and Summary
  finalize:
    name: 📝 Phase 4 - Finalize
    needs: [analyze-flows, instrument-flows, compile-and-fix]
    if: always() && needs.analyze-flows.outputs.has-flows == 'true'
    uses: ./.github/workflows/04-finalize.yml
    with:
      trigger_ref: ${{ github.event.pull_request.head.ref || github.ref }}
      compilation-success: ${{ needs.compile-and-fix.outputs.compilation-success == 'true' }}
      fixes-applied: ${{ needs.compile-and-fix.outputs.fixes-applied }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ========================================================================
  # SUMMARY: Overall pipeline status
  # ========================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    needs: [analyze-flows, instrument-flows, compile-and-fix, finalize]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Pipeline Status Summary
        run: |
          echo "## 🚀 AutoTracer Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase Results" >> $GITHUB_STEP_SUMMARY
          echo "- **🔍 Analyze Flows:** ${{ needs.analyze-flows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **🎯 Instrument Flows:** ${{ needs.instrument-flows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **🔧 Compile & Fix:** ${{ needs.compile-and-fix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **📝 Finalize:** ${{ needs.finalize.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Flows Found:** ${{ needs.analyze-flows.outputs.has-flows }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Compilation Success:** ${{ needs.compile-and-fix.outputs.compilation-success }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Summary Generated:** ${{ needs.finalize.outputs.summary-generated }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Committed:** ${{ needs.finalize.outputs.changes-committed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Context" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY