name: "04 - Finalize & Summary"

on:
  workflow_call:
    inputs:
      trigger_ref:
        description: 'Git reference to checkout'
        required: false
        type: string
        default: ''
      compilation-success:
        description: 'Whether compilation was successful'
        required: true
        type: boolean
      fixes-applied:
        description: 'Number of fix attempts made'
        required: false
        type: string
        default: '0'
    outputs:
      summary-generated:
        description: 'Whether summary was generated successfully'
        value: ${{ jobs.finalize.outputs.summary-generated }}
      changes-committed:
        description: 'Whether changes were committed'
        value: ${{ jobs.finalize.outputs.changes-committed }}
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    name: 📝 Generate Summary & Commit
    runs-on: ubuntu-latest
    outputs:
      summary-generated: ${{ steps.generate-summary.outputs.success }}
      changes-committed: ${{ steps.commit-changes.outputs.committed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trigger_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Prepare summary context
        id: prepare-context
        run: |
          echo "## 📋 Preparing Summary Context" >> $GITHUB_STEP_SUMMARY
          
          # Check what artifacts we have
          echo "### Available Artifacts" >> $GITHUB_STEP_SUMMARY
          find . -name "*.json" -o -name "*.log" -o -name "*.txt" | sort >> $GITHUB_STEP_SUMMARY
          
          # Create a context file for Claude
          cat > summary_context.txt << EOF
          AutoTracer Pipeline Execution Summary
          ====================================
          
          Pipeline Status: ${{ inputs.compilation-success && 'SUCCESS' || 'FAILED' }}
          Compilation Attempts: ${{ inputs.fixes-applied }}
          
          Available Data:
          - flows.json: $([ -f flows.json ] && echo "✅ Available" || echo "❌ Missing")
          - docs/flows/: $([ -d docs/flows ] && echo "✅ Available ($(ls docs/flows/ 2>/dev/null | wc -l) files)" || echo "❌ Missing")
          - Compilation logs: $([ -f compile.log ] && echo "✅ Available" || echo "❌ Missing")
          - Instrumented code: $(find . -name "*.go" | wc -l) Go files
          
          Execution Context:
          - Trigger: ${{ github.event_name }}
          - Repository: ${{ github.repository }}
          - Branch: ${{ github.ref }}
          - Commit: ${{ github.sha }}
          - Timestamp: $(date)
          EOF
          
          echo "✅ Context prepared for summary generation" >> $GITHUB_STEP_SUMMARY

      - name: Generate comprehensive summary
        id: generate-summary
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/prompts/04-generate-summary.md
          allowed_tools: |
            View,Read,Write,BatchTool
          max_turns: "20"

      - name: Validate summary generation
        id: validate-summary
        run: |
          if [ -f "INSTRUMENTATION_REPORT.md" ]; then
            echo "✅ Summary report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "success=true" >> $GITHUB_OUTPUT
            
            # Show summary stats
            LINES=$(wc -l < INSTRUMENTATION_REPORT.md)
            SIZE=$(wc -c < INSTRUMENTATION_REPORT.md)
            echo "📊 Report: $LINES lines, $SIZE characters" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Summary report not generated" >> $GITHUB_STEP_SUMMARY
            echo "success=false" >> $GITHUB_OUTPUT
            
            # Create a basic summary
            cat > INSTRUMENTATION_REPORT.md << EOF
          # AutoTracer Pipeline Summary
          
          ## Status
          - **Pipeline Status:** ${{ inputs.compilation-success && 'SUCCESS' || 'FAILED' }}
          - **Compilation Attempts:** ${{ inputs.fixes-applied }}
          - **Generated:** $(date)
          
          ## Results
          $([ -f flows.json ] && echo "- Business flows analyzed" || echo "- No flows analyzed")
          $([ -f compile.log ] && echo "- Compilation attempted" || echo "- No compilation attempted")
          $(find . -name "*.go" -newer flows.json 2>/dev/null | head -1 | grep -q . && echo "- Code instrumentation applied" || echo "- No instrumentation applied")
          
          ---
          *Generated by AutoTracer Pipeline*
          EOF
          fi

      - name: Commit changes
        id: commit-changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "AutoTracer Pipeline"
          
          # Add all changes
          git add -A
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit" >> $GITHUB_STEP_SUMMARY
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            # Create detailed commit message
            cat > commit_message.txt << EOF
          feat: AutoTracer OpenTelemetry instrumentation
          
          🔍 Business Logic Analysis:
          $([ -f flows.json ] && jq -r '.flows | length' flows.json || echo "0") flows identified and documented
          
          🎯 Instrumentation Applied:
          $(find . -name "*.go" -newer flows.json 2>/dev/null | wc -l) Go files instrumented with OpenTelemetry
          
          🔧 Compilation Status:
          ${{ inputs.compilation-success && '✅ Successful' || '❌ Failed' }} after ${{ inputs.fixes-applied }} attempts
          
          📝 Documentation:
          - Comprehensive instrumentation report generated
          - Business flow documentation created
          
          Co-authored-by: AutoTracer Pipeline <actions@github.com>
          [skip ci]
          EOF
            
            git commit -F commit_message.txt
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes committed successfully" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push changes
        id: push-changes
        if: |
          steps.commit-changes.outputs.committed == 'true' && (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          )
        run: |
          if git push; then
            echo "✅ Changes pushed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed to push changes" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request' && steps.generate-summary.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the summary report
            let summary = '## 🤖 AutoTracer Pipeline Results\n\n';
            
            try {
              if (fs.existsSync('INSTRUMENTATION_REPORT.md')) {
                const report = fs.readFileSync('INSTRUMENTATION_REPORT.md', 'utf8');
                summary += report;
              } else {
                summary += '⚠️ Summary report not found, but pipeline execution details below:\n\n';
              }
            } catch (error) {
              summary += '❌ Error reading summary report.\n\n';
            }
            
            // Add pipeline metadata
            summary += '\n\n---\n\n';
            summary += '### 🔧 Pipeline Execution Details\n';
            summary += `- **Status:** ${{ inputs.compilation-success && '✅ Success' || '❌ Failed' }}\n`;
            summary += `- **Compilation Attempts:** ${{ inputs.fixes-applied }}\n`;
            summary += `- **Trigger:** ${{ github.event_name }}\n`;
            summary += `- **Commit:** \`${{ github.sha }}\`\n`;
            summary += `- **Changes Committed:** ${{ steps.commit-changes.outputs.committed == 'true' && '✅ Yes' || '❌ No' }}\n`;
            summary += `- **Timestamp:** ${new Date().toISOString()}\n`;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Handle fork PRs
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          steps.commit-changes.outputs.committed == 'true'
        run: |
          echo "## 🔄 Fork PR Handling" >> $GITHUB_STEP_SUMMARY
          
          # Create patch file
          git diff HEAD~1 > autotracer-instrumentation.patch
          
          echo "⚠️ This PR is from a fork. Changes cannot be pushed directly." >> $GITHUB_STEP_SUMMARY
          echo "📎 Instrumentation patch file created: autotracer-instrumentation.patch" >> $GITHUB_STEP_SUMMARY
          
          # Upload patch as artifact
          echo "Patch file available in artifacts for manual application." >> $GITHUB_STEP_SUMMARY

      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-results
          path: |
            INSTRUMENTATION_REPORT.md
            *.patch
            summary_context.txt
            commit_message.txt
          retention-days: 7

      - name: Final status summary
        if: always()
        run: |
          echo "## 🎯 Final Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Overall Status:** ${{ inputs.compilation-success && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Summary Generated:** ${{ steps.generate-summary.outputs.success == 'true' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Committed:** ${{ steps.commit-changes.outputs.committed == 'true' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time:** $(date)" >> $GITHUB_STEP_SUMMARY